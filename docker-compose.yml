services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: axionphare
      POSTGRES_PASSWORD: axionphare
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axionphare -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_USUARIO: axionphare
      DB_SENHA: axionphare
      DB_HOST: db
      DB_PORT: 5432
      DB_SCHEM: postgres
      SEGREDO: (SEGREDO AQUI)
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
