spec:
  contents:
    openapi: 3.1.0
    info:
      title: FastAPI
      version: 0.1.0
    tags:
      - name: Autenticacao
        description: Autenticação e sessão de usuários (login, logout, refresh e usuário
          atual).
      - name: Diagnostico
        description: Endpoints de diagnóstico e saúde do servidor, banco de dados e desktop.
      - name: Usuarios
        description: Cadastro e manutenção de usuários do sistema.
      - name: Fornecedores
        description: Cadastro e manutenção de fornecedores.
      - name: Materias Primas
        description: Cadastro e manutenção de matérias-primas.
      - name: Lotes
        description: Cadastro e manutenção de lotes de matérias-primas.
      - name: Estoque
        description: Consulta de estoque e registro de movimentações.
      - name: Compras
        description: Pedidos de compra, recebimento, cancelamento e itens.
      - name: Formulas
        description: Fórmulas de produção e seus itens/componentes.
      - name: Clientes
        description: Cadastro e manutenção de clientes.
      - name: Pedidos
        description: Pedidos de venda e seus itens.
      - name: Producao
        description: Ordens de produção, início, finalização, cancelamento e consumos.
      - name: Consumo
        description: Consulta de consumos de matérias-primas na produção.
      - name: Previsoes
        description: Geração e consulta de previsões de demanda.
      - name: Sugestoes de Compra
        description: Geração, aprovação e rejeição de sugestões de compra.
      - name: Alertas
        description: Listagem e resolução de alertas.
      - name: Dashboard
        description: Indicadores e resumos gerais e por área.
      - name: Relatorios
        description: Relatórios operacionais de consumo, estoque, vencimentos, compras,
          produção e previsões.
      - name: Graficos
        description: Dados para gráficos.
    paths:
      /auth/login:
        post:
          tags:
            - Autenticacao
          summary: Realizar Login
          operationId: realizar_login_auth_login_post
          requestBody:
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/PromptLogin"
            required: true
          responses:
            "200":
              description: Successful Response
            "422":
              description: Validation Error
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/HTTPValidationError"
      /auth/logout:
        post:
          tags:
            - Autenticacao
          summary: Realizar Logout
          operationId: realizar_logout_auth_logout_post
          parameters:
            - name: authorization
              in: header
              required: false
              schema:
                type: string
                title: Authorization
          responses:
            "200":
              description: Successful Response
            "422":
              description: Validation Error
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/HTTPValidationError"
      /auth/me:
        get:
          tags:
            - Autenticacao
          summary: Usuario Atual
          operationId: usuario_atual_auth_me_get
          parameters:
            - name: authorization
              in: header
              required: false
              schema:
                type: string
                title: Authorization
          responses:
            "200":
              description: Successful Response
            "422":
              description: Validation Error
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/HTTPValidationError"
      /auth/refresh:
        post:
          tags:
            - Autenticacao
          summary: Refresh Token
          operationId: refresh_token_auth_refresh_post
          parameters:
            - name: authorization
              in: header
              required: false
              schema:
                type: string
                title: Authorization
          responses:
            "200":
              description: Successful Response
            "422":
              description: Validation Error
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/HTTPValidationError"
      /diagnosticos/axionphare_desktop:
        get:
          tags:
            - Diagnostico
          summary: Axionphare Desktop
          operationId: axionphare_desktop_diagnosticos_axionphare_desktop_get
          responses:
            "200":
              description: Successful Response
      /diagnosticos/informacao_servidor:
        get:
          tags:
            - Diagnostico
          summary: Informacao Servidor
          operationId: informacao_servidor_diagnosticos_informacao_servidor_get
          responses:
            "200":
              description: Successful Response
      /diagnosticos/status_banco:
        get:
          tags:
            - Diagnostico
          summary: Status Banco
          operationId: status_banco_diagnosticos_status_banco_get
          responses:
            "200":
              description: Successful Response
      /usuarios/:
        get:
          tags:
            - Usuarios
          summary: Listar Usuarios
          operationId: listar_usuarios_usuarios__get
          responses:
            "200":
              description: Successful Response
        post:
          tags:
            - Usuarios
          summary: Criar Usuario
          operationId: criar_usuario_usuarios__post
          parameters:
            - name: authorization
              in: header
              required: false
              schema:
                type: string
                title: Authorization
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/BaseCriacaoUsuario"
          responses:
            "200":
              description: Successful Response
            "422":
              description: Validation Error
