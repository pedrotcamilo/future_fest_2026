<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Administracao</title>

    <link rel="stylesheet" href="css/index.css">

    <script src="js/info_servidor.js" defer></script>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body data-bs-theme="dark">
    <div class="container">

        <div class="position-relative corpo-login">
            <div class="position-absolute top-50 start-50 translate-middle" style="width:100%;max-width:360px">

                <img src="content/images/logo2.png" class="logo-axionphare">

                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="E-Mail" id="email">
                </div>

                <div class="input-group mb-3">
                    <input type="password" class="form-control" placeholder="Senha" id="senha">
                    <span class="input-group-text" id="btn-esconder-senha" style="cursor:pointer">
                        <i class="bi bi-eye-fill"></i>
                    </span>
                </div>

                <button type="button" class="btn btn-primary mb-3" id="btn-autenticar">
                    <span class="d-flex gap-3 align-items-center justify-content-center">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <b>Autenticar</b>
                    </span>
                </button>

                <div id="login-msg" class="text-danger small text-center"></div>
            </div>
        </div>

        <div class="position-absolute bottom-0 start-0 text-body-tertiary m-3 info-servidor">
            <span id="info-servidor">...</span>
        </div>
    </div>

    <div class="modal fade" id="modal-alterar-senha" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Alterar Senha</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <div class="mb-3"><label class="form-label">Email</label><input type="text" class="form-control" id="alt-senha-email"></div>
                    <div class="mb-3"><label class="form-label">Nova Senha</label><input type="password" class="form-control" id="alt-senha-nova"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary" id="btn-confirmar-alt-senha">Confirmar</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
