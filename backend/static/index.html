<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Painel Administracao</title>
    <link rel="shortcut icon" href="img/icone.png" type="image/x-icon">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary ">
        <div class="container-fluid">
            <div class="navbar-brand d-flex">
                <img src="img/axionphare-logo-paineldecontrole.png" style="height: 5vh;">
            </div>
            <span id="notif-msg" class="fw-bold"></span>
            <a class="btn btn-primary" href="/docs">Documentação</a>
        </div>
    </nav>
    <div class="container m-5">
        <div class="row">
            <div class="col">
                <div>
                    <h3 class="mb-3">Criar usuário</h3>
                    <div class="input-group mb-2" style="width: 30vw;">
                        <input type="text" class="form-control" placeholder="E-Mail" aria-label="E-Mail" aria-describedby="basic-addon1" id="email-criarusuario">
                    </div>
                    <div class="input-group mb-2" style="width: 30vw;">
                        <input type="text" class="form-control" placeholder="Nome" aria-label="Nome" aria-describedby="basic-addon1" id="nome-criarusuario">
                    </div>
                    <div class="input-group mb-4" style="width: 30vw;">
                        <input type="password" class="form-control" placeholder="Senha" aria-label="Senha" aria-describedby="basic-addon1" id="senha-criarusuario">
                    </div>
                    <button type="button" class="btn btn-primary" id="input-forms" onclick="criarUsuario()">Criar Usuário</button>
                </div>
            </div>
            <div class="col">
                <h3 class="mb-3">Apagar Usuário</h3>
                    <div class="input-group mb-2" style="width: 5vw;">
                        <input type="number" class="form-control" placeholder="ID" aria-label="ID" aria-describedby="basic-addon1" id="id-apagarusuario">
                    </div>
                    <button type="button" class="btn btn-danger" onclick="apagarUsuario()">Apagar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="js/index.js"></script>
</body>
</html>
