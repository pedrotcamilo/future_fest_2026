<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paínel de Administração</title>

    <link rel="stylesheet" href="css/index.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body data-bs-theme="dark">
    <div class="container">

        <!--    Paínel de Login    -->
        <div class="position-relative">
            <div class="position-absolute top-50 start-50 translate-middle">

                <!--  Logo  -->
                <img src="content/images/logo2.png" class="logo-axionphare">

                <!--  E-mail  -->
                <div class="input-group mb-3">
                    <input type="text" class="form-control" placeholder="E-Mail">
                </div>

                <!--  Senha  -->
                <div class="input-group mb-3">
                    <input type="password" class="form-control" placeholder="Senha">
                    <span class="input-group-text">
                        <i class="bi bi-eye-fill" id="btn-esconder-senha"></i>
                    </span>
                </div>

                <!--  Botão Autenticar  -->
                <button type="button" class="btn btn-primary mb-3" id="btn-autenticar">
                    <span class="d-flex gap-3">
                        <i class="bi bi-box-arrow-in-right"></i>
                        <b>Autenticar</b>
                    </span>
                </button>

                <!--  Botao Alterar Senha  -->
                <button type="button" class="btn mb-3" id="btn-autenticar">
                    Alterar Senha
                </button>
            </div>
        </div>

        <div class="position-absolute bottom-0 start-0 text-body-tertiary m-3">
            <span>Informações do Software</span>
        </div>
    </div>
</body>
</html>
